# Profil robot AgiBot D1 Ultra / D1 Edu
# SSH WiFi   : ssh firefly@192.168.234.1   (password: firefly)
# SSH Ethernet: ssh firefly@192.168.168.168 (password: firefly)
# SDK        : UDP port 43988
# Nav2       : tourne en natif sur le robot
# LiDAR      : absent sur D1 Ultra (present sur D1 Max)
#
# Pour porter sur D1 Max :
#   - changer lidar_topic vers /rslidar_points_head
#   - ajouter lidar_count: 2
#   - verifier base_frame (probablement base_link aussi)
/**:
  ros__parameters:
    # Frames TF — confirmes via ros2 topic echo /odom/current_pose
    base_frame: base_link
    odom_frame: odom
    map_frame: map

    # Perception : odom_to_tf
    # Type confirme : nav_msgs/msg/Odometry @ 50Hz
    odom_topic: /odom/current_pose
    scan_topic: /scan
    scan_synced_topic: /scan_synced

    # LiDAR — absent sur D1 Ultra
    # Sur D1 Max : /rslidar_points_head (avant) + /rslidar_points_tail (arriere)
    target_frame: lidar
    min_height: -0.3
    max_height: 0.5
    use_inf: true
    lidar_topic: /laser_scan

    # Actuation — cmd_vel confirme : geometry_msgs/msg/Twist
    cmd_vel_topic: /cmd_vel
    network_interface: eth0

    # Vitesses SDK D1 Ultra (high-level move API)
    # vx  : -3.0 a -0.05 / 0.05 a 3.0 m/s
    # vy  : -1.0 a -0.1  / 0.1  a 1.0 m/s
    # vyaw: -3.0 a -0.02 / 0.02 a 3.0 rad/s
    max_vx: 0.5      # limite securite interieur (max physique: 3.0)
    max_vy: 0.5      # limite securite interieur (max physique: 1.0)
    max_vyaw: 1.0    # limite securite interieur (max physique: 3.0)
